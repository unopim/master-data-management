name: Set up UnoPim core with the package
description: Check out UnoPim core, install its dependencies and mount the package checked out at ./package into it.

inputs:
  core-ref:
    description: UnoPim core branch or tag to test against
    required: true
  install-package:
    description: Require the package from its path and register its test namespace
    default: 'true'
  install-node:
    description: Install the Node dependencies core needs at runtime
    default: 'true'

runs:
  using: composite
  steps:
    - name: Checkout UnoPim core
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        repository: unopim/unopim
        ref: ${{ inputs.core-ref }}
        path: core
        persist-credentials: false

    - name: Install Composer dependencies
      uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      with:
        composer-options: "--optimize-autoloader"
        working-directory: core

    - name: Mount package into core
      shell: bash
      run: |
        mkdir -p core/packages/Webkul/MasterDataManagement
        rsync -a --exclude .git --exclude node_modules package/ core/packages/Webkul/MasterDataManagement/

    - name: Require package from path
      if: inputs.install-package == 'true'
      shell: bash
      working-directory: core
      run: |
        composer config repositories.mdm path packages/Webkul/MasterDataManagement
        jq '.["autoload-dev"]["psr-4"]["Webkul\\MasterDataManagement\\Tests\\"] = "packages/Webkul/MasterDataManagement/tests/"' composer.json > composer.json.tmp
        mv composer.json.tmp composer.json
        composer require unopim/master-data-management:@dev --no-interaction --prefer-dist

    - name: Setup Node
      if: inputs.install-node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'

    - name: Install Node dependencies
      if: inputs.install-node == 'true'
      shell: bash
      working-directory: core
      run: npm install --omit=dev --no-audit --no-fund --no-progress --prefer-offline
