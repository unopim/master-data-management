name: Linting Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: UnoPim core branch, tag or SHA to test against
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linting_tests:
    runs-on: ubuntu-24.04
    name: Laravel Pint Code Style

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Running Pint Test
        uses: aglipanci/laravel-pint-action@2.3.1
        with:
          testMode: true
          verboseMode: true
