name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      core_ref:
        description: UnoPim core branch or tag to test against
        default: 3.x

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  CORE_REF: ${{ inputs.core_ref || vars.UNOPIM_CORE_REF || '3.x' }}

jobs:
  playwright_tests:
    if: github.repository == 'unopim/master-data-management' && github.event_name != 'pull_request'
    name: Playwright E2E | Shard ${{ matrix.shard-index }}/${{ matrix.shard-total }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        shard-index: [1,2]
        shard-total: [2]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: unopim
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=600m
          --tmpfs /tmp:rw,noexec,nosuid,size=100m

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: package

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Set up UnoPim core with the package
        uses: ./package/.github/actions/setup-core
        with:
          core-ref: ${{ env.CORE_REF }}
          install-package: 'true'
          install-node: 'true'

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package/tests/e2e-pw/package.json') }}

      - name: Install npm & Playwright browsers
        working-directory: core/tests/e2e-pw
        run: |
          npm install --no-progress --prefer-offline
          npx playwright install --with-deps chromium

      - name: Setting Environment
        working-directory: core
        run: |
          cp .env.example .env
          sed -i "s|^\(APP_ENV=\s*\).*$|\1testing|" .env
          sed -i "s|^\(DB_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(DB_PORT=\s*\).*$|\13306|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1unopim|" .env
          sed -i "s|^\(DB_USERNAME=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PASSWORD=\s*\).*$|\1root|" .env
          sed -i "s|^\(APP_DEBUG=\s*\).*$|\1false|" .env
          sed -i "s|^\(APP_URL=\s*\).*$|\1http://127.0.0.1:8000|" .env
          echo "REST_API_RATE_LIMIT=100000" >> .env
          echo "ADMIN_LOGIN_RATE_LIMIT=20" >> .env
          echo "OAUTH_TOKEN_RATE_LIMIT=100000" >> .env

      - name: Running UnoPim Installer with MDM & Start Server
        working-directory: core
        env:
          INSTALLER_ADMIN_EMAIL: ${{ secrets.INSTALLER_ADMIN_EMAIL || 'admin@example.com' }}
          INSTALLER_ADMIN_PASSWORD: ${{ secrets.INSTALLER_ADMIN_PASSWORD || 'admin123' }}
        run: |
          php artisan unopim:install --skip-env-check --skip-admin-creation --with-demo-data --modules=pim,mdm
          php artisan masterdata:install
          PHP_CLI_SERVER_WORKERS=6 php artisan serve --no-reload --host=0.0.0.0 --port=8000 > /tmp/server.log 2>&1 &
          php artisan queue:work > /tmp/queue.log 2>&1 &
          echo "Waiting for server..."
          timeout 30 bash -c 'until curl -s http://127.0.0.1:8000 > /dev/null; do sleep 1; done' || (cat /tmp/server.log && exit 1)

      - name: Run Playwright tests
        working-directory: core/tests/e2e-pw
        env:
          PW_WORKERS: '3'
        run: npx playwright test tests/masterdata --shard=${{ matrix.shard-index }}/${{ matrix.shard-total }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-shard-${{ matrix.shard-index }}-${{ github.run_id }}
          path: |
            core/tests/e2e-pw/playwright-report
            core/tests/e2e-pw/test-results
            core/storage/logs/*.log
            /tmp/server.log
            /tmp/queue.log
          retention-days: 1

  playwright_tests_pull_request:
    if: github.repository == 'unopim/master-data-management' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    name: Playwright E2E | Shard ${{ matrix.shard-index }}/${{ matrix.shard-total }}
    strategy:
      matrix:
        shard-index: [1,2]
        shard-total: [2]
    steps:
      - name: Defer to the merge queue
        run: echo "::notice::Playwright E2E runs in the merge queue and on the release lines."
