name: Static Analysis

on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      core_ref:
        description: UnoPim core branch or tag to test against
        default: 3.x

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CORE_REF: ${{ inputs.core_ref || vars.UNOPIM_CORE_REF || '3.x' }}

jobs:
  phpstan:
    if: github.repository == 'unopim/master-data-management'
    runs-on: ubuntu-24.04
    name: PHPStan (Larastan)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: package

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Set up UnoPim core with the package
        uses: ./package/.github/actions/setup-core
        with:
          core-ref: ${{ env.CORE_REF }}
          install-package: 'true'
          install-node: 'false'

      - name: Run PHPStan
        working-directory: core
        run: vendor/bin/phpstan analyse packages/Webkul/MasterDataManagement/src --memory-limit=1G --no-progress

  rector:
    if: github.repository == 'unopim/master-data-management'
    runs-on: ubuntu-24.04
    name: Rector (dry-run, advisory)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: package

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Set up UnoPim core with the package
        uses: ./package/.github/actions/setup-core
        with:
          core-ref: ${{ env.CORE_REF }}
          install-package: 'true'
          install-node: 'false'

      - name: Run Rector (dry-run)
        working-directory: core
        continue-on-error: true
        run: vendor/bin/rector process packages/Webkul/MasterDataManagement/src --dry-run --no-progress-bar
