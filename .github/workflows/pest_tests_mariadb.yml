name: Pest Tests (MariaDB)

on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      core_ref:
        description: UnoPim core branch or tag to test against
        default: 3.x

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CORE_REF: ${{ inputs.core_ref || vars.UNOPIM_CORE_REF || '3.x' }}

jobs:
  pest-mariadb:
    if: github.repository == 'unopim/master-data-management' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    name: Pest Tests (MariaDB ${{ matrix.mariadb }})
    strategy:
      fail-fast: false
      matrix:
        mariadb: ['10.11', '11.8']

    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: unopim
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: package

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Set up UnoPim core with the package
        uses: ./package/.github/actions/setup-core
        with:
          core-ref: ${{ env.CORE_REF }}
          install-package: 'true'
          install-node: 'true'

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install --yes mariadb-client

      - name: Setting Environment
        working-directory: core
        run: |
          cp .env.example .env
          sed -i "s|^\(APP_ENV=\s*\).*$|\1testing|" .env
          sed -i "s|^\(DB_CONNECTION=\s*\).*$|\1mariadb|" .env
          sed -i "s|^\(DB_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(DB_PORT=\s*\).*$|\13306|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1unopim|" .env
          sed -i "s|^\(DB_USERNAME=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PASSWORD=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PREFIX=\s*\).*$|\1wk_|" .env
          sed -i "s|^\(ELASTICSEARCH_ENABLED=\s*\).*$|\1false|" .env

      - name: Running UnoPim Installer with MDM
        working-directory: core
        run: |
          php artisan unopim:install --skip-env-check --skip-admin-creation --modules=pim,mdm
          php artisan masterdata:install

      - name: Bind package tests to Pest
        working-directory: core
        run: |
          cat >> tests/Pest.php <<'PHP'
          uses(Webkul\MasterDataManagement\Tests\MasterDataTestCase::class)->in('../packages/Webkul/MasterDataManagement/tests');
          PHP

      - name: Running Pest Tests
        working-directory: core
        run: vendor/bin/pest --parallel --processes=4 --colors=always --log-teamcity pest-teamcity.log packages/Webkul/MasterDataManagement/tests

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pest-mariadb-${{ matrix.mariadb }}-teamcity
          path: core/pest-teamcity.log
          if-no-files-found: ignore

  pest-mariadb-pull-request:
    if: github.repository == 'unopim/master-data-management' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    name: Pest Tests (MariaDB ${{ matrix.mariadb }})
    strategy:
      matrix:
        mariadb: ['10.11', '11.8']
    steps:
      - name: Defer to the merge queue
        run: echo "::notice::Pest on MariaDB runs in the merge queue and on the release lines."
