name: Pest Tests (MariaDB)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: UnoPim core branch, tag or SHA to test against
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pest-mariadb:
    runs-on: ubuntu-24.04
    name: Pest Tests (MariaDB ${{ matrix.mariadb }})

    strategy:
      fail-fast: false
      matrix:
        mariadb: ['10.11', '11.8']

    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: unopim
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout MDM
        uses: actions/checkout@v5
        with:
          path: mdm-package

      - name: Resolve UnoPim ref
        id: unopim
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.core_ref }}
          VARS_REF: ${{ vars.UNOPIM_CORE_REF }}
        run: |
          ref="${INPUT_REF:-$VARS_REF}"
          if [ -z "$ref" ]; then
            ref=$(gh api repos/unopim/unopim/releases/latest --jq .tag_name)
          fi
          test -n "$ref"
          echo "Testing against UnoPim $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout UnoPim
        uses: actions/checkout@v5
        with:
          repository: unopim/unopim
          ref: ${{ steps.unopim.outputs.ref }}
          path: unopim

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install --yes mariadb-client

      - name: Copy MDM into UnoPim packages
        run: |
          mkdir -p unopim/packages/Webkul/MasterDataManagement
          cp -r mdm-package/src unopim/packages/Webkul/MasterDataManagement/src
          cp -r mdm-package/tests unopim/packages/Webkul/MasterDataManagement/tests
          cp mdm-package/composer.json unopim/packages/Webkul/MasterDataManagement/composer.json
          if [ -f mdm-package/phpstan.neon.dist ]; then
            cp mdm-package/phpstan.neon.dist unopim/packages/Webkul/MasterDataManagement/phpstan.neon.dist
          fi
          if [ -d mdm-package/publishable ]; then
            cp -r mdm-package/publishable unopim/packages/Webkul/MasterDataManagement/publishable
          fi

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: |
            unopim/vendor
            ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-mdm-${{ hashFiles('unopim/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-mdm-

      - name: Install base dependencies
        working-directory: unopim
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Register MDM as a path repository and require it
        working-directory: unopim
        run: |
          composer config repositories.mdm '{"type":"path","url":"packages/Webkul/MasterDataManagement","options":{"symlink":true}}' --json
          composer require unopim/master-data-management:"*@dev" --no-interaction --no-progress --prefer-dist

      - name: Register MDM test namespace in root autoload-dev
        working-directory: unopim
        run: |
          php -r "
            \$json = json_decode(file_get_contents('composer.json'), true);
            \$json['autoload-dev']['psr-4']['Webkul\\\\MasterDataManagement\\\\Tests\\\\'] = 'packages/Webkul/MasterDataManagement/tests/';
            file_put_contents('composer.json', json_encode(\$json, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
          "
          composer dump-autoload --optimize

      - name: Add MDM test suite to phpunit.xml
        working-directory: unopim
        run: |
          sed -i '/<\/testsuites>/i\
              <testsuite name="MDM Unit">\
                  <directory suffix="Test.php">packages/Webkul/MasterDataManagement/tests/Unit</directory>\
              </testsuite>\
              <testsuite name="MDM Feature">\
                  <directory suffix="Test.php">packages/Webkul/MasterDataManagement/tests/Feature</directory>\
              </testsuite>' phpunit.xml

      - name: Register MDM test case in Pest.php
        working-directory: unopim
        run: |
          sed -i '/^use Webkul\\Category\\Tests\\CategoryTestCase;/a use Webkul\\MasterDataManagement\\Tests\\MasterDataTestCase;' tests/Pest.php
          sed -i '/^uses(CategoryTestCase::class)/a uses(MasterDataTestCase::class)->in('\''../packages/Webkul/MasterDataManagement/tests'\'');' tests/Pest.php

      - name: Setting Environment
        working-directory: unopim
        run: |
          cp .env.example .env
          sed -i "s|^\(APP_ENV=\s*\).*$|\1testing|" .env
          sed -i "s|^\(DB_CONNECTION=\s*\).*$|\1mariadb|" .env
          sed -i "s|^\(DB_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(DB_PORT=\s*\).*$|\13306|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1unopim|" .env
          sed -i "s|^\(DB_USERNAME=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PASSWORD=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PREFIX=\s*\).*$|\1wk_|" .env

      - name: Running UnoPim Installer
        working-directory: unopim
        run: |
          if php artisan unopim:install --help | grep -q -- '--modules'; then
            php artisan unopim:install --skip-env-check --skip-admin-creation --with-demo-data --modules=pim,mdm
          else
            php artisan unopim:install --skip-env-check --skip-admin-creation --with-demo-data
          fi

      - name: Running MDM Installer
        working-directory: unopim
        run: php artisan masterdata:install

      - name: Running Pest Tests (MDM)
        working-directory: unopim
        run: vendor/bin/pest --colors=always packages/Webkul/MasterDataManagement/tests
